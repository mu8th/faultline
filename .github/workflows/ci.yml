name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.6

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # The end-to-end tests spawn the example target as a local subprocess,
        # so no Docker or external services are needed for CI.
        run: pytest -q
